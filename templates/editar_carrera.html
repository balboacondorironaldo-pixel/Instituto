<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Carrera</title>
</head>

<body>

    <h1>Editar Carrera</h1>

    <form method="POST">

        <label>Nombre de la carrera:</label>
        <br>

        <input
            type="text"
            name="nombre"
            value="{{ carrera['nombre'] }}"
            required
        >

        <br><br>

        <label>Duración en años:</label>
        <br>

        <input
            type="number"
            name="duracion"
            value="{{ carrera['duracion'] }}"
            required
        >

        <br><br>

        <button type="submit">Actualizar Carrera</button>

    </form>

    <br>

    <a href="/carreras">Volver a carreras</a>

</body>
</html>
