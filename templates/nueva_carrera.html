<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Carrera</title>
</head>
<body>

    <h1>Registrar Carrera</h1>

    <form method="POST">

        <label>Nombre de la carrera:</label>
        <br>
        <input type="text" name="nombre" required>

        <br><br>

        <label>Duración en años:</label>
        <br>
        <input type="number" name="duracion" required>

        <br><br>

        <button type="submit">Guardar Carrera</button>

    </form>

    <br>

    <a href="/carreras">Volver a carreras</a>

</body>
</html>
