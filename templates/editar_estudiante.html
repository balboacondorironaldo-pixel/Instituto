<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Estudiante</title>
</head>

<body>

    <h1>Editar Estudiante</h1>

    <form method="POST">

        <label>Nombre:</label>
        <br>
        <input
            type="text"
            name="nombre"
            value="{{ estudiante['nombre'] }}"
            required
        >

        <br><br>

        <label>Apellidos:</label>
        <br>
        <input
            type="text"
            name="apellidos"
            value="{{ estudiante['apellidos'] }}"
            required
        >

        <br><br>

        <label>Fecha de nacimiento:</label>
        <br>
        <input
            type="date"
            name="fecha_nacimiento"
            value="{{ estudiante['fecha_nacimiento'] }}"
            required
        >

        <br><br>

        <button type="submit">
            Actualizar Estudiante
        </button>

    </form>

    <br>

    <a href="/estudiantes">
        Volver a estudiantes
    </a>

</body>

</html>
